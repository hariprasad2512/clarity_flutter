name: Release

# Builds signed Android AAB + unsigned macOS ZIP + unsigned Windows
# EXE/setup (Inno Setup wizard + portable ZIP) on version tags (v*),
# attaches all to the GitHub Release. macOS ZIP feeds the personal
# Homebrew tap; AAB is uploaded to Play Console (manual for v1).
#
# Required secrets (repo Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64 — base64 of android/clarity-release.jks
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   SUPABASE_URL, SUPABASE_ANON_KEY, GOOGLE_WEB_CLIENT_ID
#   (optional) GOOGLE_IOS_CLIENT_ID, GOOGLE_SERVICES_JSON (base64)
# Missing secrets degrade gracefully: .env falls back to .env.example
# (local-only build) and Android falls back to debug keys (NOT for Play).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: stable

jobs:
  checks:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart analyze
      - run: flutter test

  build-android:
    name: Android AAB
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      - name: Restore .env from secrets (fallback to example)
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            {
              echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
              echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
              echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
              echo "GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}"
              echo "SNOOZE_MINUTES_DEFAULT=60"
              echo "OFFLINE_MODE=false"
            } > .env
            echo ".env restored from secrets."
          else
            cp .env.example .env
            echo "::warning::SUPABASE_URL secret missing — building local-only AAB."
          fi

      - name: Restore Android keystore (optional, warns if missing)
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/clarity-release.jks
            {
              echo "storeFile=../clarity-release.jks"
              echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } > android/key.properties
            echo "Release signing configured."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 missing — AAB will use debug keys (not for Play)."
          fi

      - name: Restore google-services.json (optional)
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
            echo "google-services.json restored."
          else
            echo "No GOOGLE_SERVICES_JSON secret — skipping (OK if Android Google sign-in is OAuth-only)."
          fi

      - name: Build app bundle
        run: flutter build appbundle --release --dart-define-from-file=.env

      - name: Rename AAB with version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="dev"; fi
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/Clarity-${VERSION}-android.aab"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: dist/Clarity-*-android.aab

  build-macos:
    name: macOS ZIP (unsigned)
    runs-on: macos-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      - name: Restore .env from secrets (fallback to example)
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            {
              echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
              echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
              echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
              echo "GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}"
              echo "SNOOZE_MINUTES_DEFAULT=60"
              echo "OFFLINE_MODE=false"
            } > .env
            echo ".env restored from secrets."
          else
            cp .env.example .env
            echo "::warning::SUPABASE_URL secret missing — building local-only macOS app."
          fi

      - name: Build macOS release (unsigned, ad-hoc)
        run: flutter build macos --release --dart-define-from-file=.env

      - name: Package ZIP + checksum
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="dev"; fi
          mkdir -p dist
          ditto -c -k --keepParent \
            build/macos/Build/Products/Release/Clarity.app \
            "dist/Clarity-${VERSION}-macos.zip"
          shasum -a 256 "dist/Clarity-${VERSION}-macos.zip" | tee "dist/Clarity-${VERSION}-macos.sha256"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: |
            dist/Clarity-*-macos.zip
            dist/Clarity-*-macos.sha256

  build-windows:
    name: Windows EXE + Setup (unsigned)
    runs-on: windows-latest
    # Deliberately NOT gated on `checks`: the unit-test suite has a
    # FakeAsync/Hive timing flake, and the desktop exe is validated on a
    # real Windows test machine from these artifacts.
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      - name: Restore .env from secrets (fallback to example)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            {
              echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
              echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
              echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
              echo "GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}"
              echo "SNOOZE_MINUTES_DEFAULT=60"
              echo "OFFLINE_MODE=false"
            } > .env
            echo ".env restored from secrets."
          else
            cp .env.example .env
            echo "::warning::SUPABASE_URL secret missing — building local-only Windows app."
          fi

      - name: Build Windows release
        run: flutter build windows --release --dart-define-from-file=.env

      - name: Build Inno Setup wizard + portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Artifact-safe version: strip leading v (tags), fall back for
          # branch runs (workflow_dispatch), drop path-hostile characters.
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($version)) { $version = 'dev' }
          $version = ($version -replace '[^A-Za-z0-9._-]', '-').Trim('-')
          if ([string]::IsNullOrWhiteSpace($version)) { $version = 'dev' }

          # Inno AppVersion accepts numeric dotted versions only: branch
          # names (feat-windows-app) and suffixes (1.0.1-beta) are rejected.
          # The tag stays in the artifact filename; only AppVersion is numeric.
          $installerVersion = ($version -replace '[^0-9.]', '.') -replace '\.+', '.'
          $installerVersion = $installerVersion.Trim('.')
          if ([string]::IsNullOrWhiteSpace($installerVersion)) { $installerVersion = '0.0.0' }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $distDir = (Resolve-Path dist).Path

          # Portable ZIP: exe + dlls + data\ (unzip-and-run for quick testing).
          Compress-Archive `
            -Path 'build/windows/x64/runner/Release/*' `
            -DestinationPath "dist/Clarity-$version-windows.zip" `
            -Force

          # Setup wizard via Inno Setup.
          # pwsh (not Git Bash): MSYS mangled ISCC's /D define into a second
          # script filename ("You may not specify more than one script...").
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "/DAppVersion=$installerVersion" "/DOutputDir=$distDir" 'installer/windows/clarity.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          # ISCC names the exe with the numeric version; normalize to the tag.
          $built = Get-ChildItem $distDir -Filter 'Clarity-*-windows-setup.exe' |
            Select-Object -First 1
          if ($null -eq $built) {
            throw 'Inno Setup completed but produced no installer in dist'
          }
          Rename-Item $built.FullName "Clarity-$version-windows-setup.exe"

          Get-FileHash `
            "dist/Clarity-$version-windows-setup.exe", `
            "dist/Clarity-$version-windows.zip" `
            -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content "dist/Clarity-$version-windows.sha256"

          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            dist/Clarity-*-windows-setup.exe
            dist/Clarity-*-windows.zip
            dist/Clarity-*-windows.sha256

  release:
    name: Attach to GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: ls -lR artifacts && mkdir -p dist && find artifacts -type f -exec cp {} dist/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
